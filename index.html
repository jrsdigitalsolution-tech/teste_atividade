<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Tarefas</title>
    
    <!-- Carrega o Tailwind CSS para os estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carrega o Babel para traduzir o React (JSX) diretamente no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Configura as importações para o navegador entender de onde puxar o React e os Ícones -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
</head>
<body class="bg-slate-50">
    <!-- Aqui é onde o React vai injetar a aplicação -->
    <div id="root"></div>

    <!-- Script principal com o SEU CÓDIGO EXATAMENTE COMO ESTÁ -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client'; // Necessário para injetar o React no HTML
        import { LayoutDashboard, PlusCircle, UserCog, AlertCircle, CheckCircle, Clock, Calendar, MapPin, DollarSign, Activity, TrendingUp, AlertTriangle, BarChart3, Target, FileText, Settings2, Truck, Lock, Plus, X, CalendarDays, Trophy, ChevronRight } from 'lucide-react';

        // --- CONSTANTES E DADOS GERAIS ---
        const SETORES = ['Administração', 'Comercial', 'Compras', 'Financeiro', 'Produção', 'PD_I', 'Automação', 'Logística'];
        const COMPLEXIDADES = ['Baixa', 'Média', 'Alta'];
        const STATUS = {
        PENDENTE: 'Pendente',
        AGUARDANDO_AVALIACAO: 'Aguardando Avaliação',
        CONCLUIDA: 'Concluída'
        };

        // --- DADOS DE EXEMPLO (MOCK DATA) ---
        const todayStr = new Date().toISOString().split('T')[0];
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 2);
        const yesterdayStr = yesterdayDate.toISOString().split('T')[0];
        const nextWeekDate = new Date();
        nextWeekDate.setDate(nextWeekDate.getDate() + 5);
        const nextWeekStr = nextWeekDate.toISOString().split('T')[0];

        // --- DADOS DE OBJETIVOS MACRO ---
        const INITIAL_OBJETIVOS = ['Fábrica Principal', 'Proposta 2026/05', 'Geral', 'Logística Regional'];

        const INITIAL_TASKS = [
        {
            id: '1',
            setorSolicitante: 'Produção',
            setorExecutor: 'Produção',
            dataAbertura: yesterdayStr,
            conclusaoPrevista: yesterdayStr, // Atrasada (Vencida a 2 dias)
            complexidade: 'Alta',
            descricao: 'Manutenção preventiva na linha de montagem principal. Substituição de correias.',
            objetivo: 'Fábrica Principal',
            clienteFornecedor: 'Equipe Interna',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: true,
            tipoCusto: 'Peças de reposição (Correias)',
            valorCusto: '800.00',
            dependencia: '', // Sem dependência
            status: STATUS.PENDENTE
        },
        {
            id: '2',
            setorSolicitante: 'Comercial',
            setorExecutor: 'Comercial',
            dataAbertura: todayStr,
            conclusaoPrevista: nextWeekStr, // No prazo
            complexidade: 'Média',
            descricao: 'Apresentação comercial e fechamento de contrato com novo cliente VIP.',
            objetivo: 'Proposta 2026/05',
            clienteFornecedor: 'Empresa Tech SA',
            deslocamento: true,
            local: 'Sede do Cliente (São Paulo)',
            duracaoDeslocamento: '4',
            unidadeDeslocamento: 'Horas',
            geraCusto: true,
            tipoCusto: 'Transporte e Alimentação',
            valorCusto: '150.00',
            dependencia: '1', // Inteligência: ID '1' = Depende da Manutenção (Produção)
            status: STATUS.PENDENTE
        },
        {
            id: '3',
            setorSolicitante: 'Financeiro',
            setorExecutor: 'Compras',
            dataAbertura: yesterdayStr,
            conclusaoPrevista: nextWeekStr,
            complexidade: 'Baixa',
            descricao: 'Cotação e compra de novos equipamentos de proteção individual (EPIs).',
            objetivo: 'Geral',
            clienteFornecedor: 'Diversos Fornecedores',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: true,
            tipoCusto: 'Compra de Material',
            valorCusto: '2500.00',
            dependencia: '',
            status: STATUS.AGUARDANDO_AVALIACAO,
            conclusaoRealUser: todayStr
        },
        {
            id: '4',
            setorSolicitante: 'Logística',
            setorExecutor: 'Logística',
            dataAbertura: '2026-05-01',
            conclusaoPrevista: '2026-05-15',
            complexidade: 'Média',
            descricao: 'Otimização das rotas de entrega semanais na região sul.',
            objetivo: 'Logística Regional',
            clienteFornecedor: 'Transportadoras Parceiras',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: false,
            tipoCusto: '',
            valorCusto: '',
            dependencia: '',
            status: STATUS.CONCLUIDA,
            avaliacao: 'As rotas foram bem desenhadas, tivemos uma economia de 10% no tempo.',
            dataAvaliacao: '2026-05-16',
            conclusaoReal: '2026-05-14',
            necessitaAjuste: false,
            encaminhamento: 'Monitorar os resultados de entrega durante o próximo mês.'
        }
        ];

        // --- FUNÇÃO AUXILIAR PARA DATA E SEMANA ---
        const getWeekNumber = (d) => {
        const date = new Date(d.getTime());
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
        const week1 = new Date(date.getFullYear(), 0, 4);
        return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        };

        // --- COMPONENTE PRINCIPAL ---
        export default function App() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [tasks, setTasks] = useState(INITIAL_TASKS);
        const [objetivos, setObjetivos] = useState(INITIAL_OBJETIVOS);

        // Inteligência do Cabeçalho (Data e Semana Dinâmicas)
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
        const weekNumber = getWeekNumber(currentDate);

        // Estados e Refs para o Menu Flutuante (FAB)
        const [isFabOpen, setIsFabOpen] = useState(false);
        const fabRef = useRef(null);
        const clickTimer = useRef(null);

        // Lógica de fechamento do menu ao clicar fora
        useEffect(() => {
            const handleClickOutside = (event) => {
            if (fabRef.current && !fabRef.current.contains(event.target)) {
                setIsFabOpen(false);
            }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        // Lógica Inteligente do Botão: 1 Clique vs 2 Cliques
        const handleFabClick = (e) => {
            e.preventDefault();
            if (clickTimer.current === null) {
            clickTimer.current = setTimeout(() => {
                setIsFabOpen(!isFabOpen);
                clickTimer.current = null;
            }, 250);
            } else {
            // Duplo clique - Redireciona para o início (Dashboard)
            clearTimeout(clickTimer.current);
            clickTimer.current = null;
            setActiveTab('dashboard');
            setIsFabOpen(false);
            }
        };

        const addTask = (newTask) => {
            if (newTask.objetivo && !objetivos.includes(newTask.objetivo)) {
            setObjetivos([...objetivos, newTask.objetivo]);
            }
            const taskWithMeta = {
            ...newTask,
            id: Date.now().toString(),
            status: STATUS.PENDENTE,
            };
            setTasks([...tasks, taskWithMeta]);
            setActiveTab('dashboard'); 
        };

        const requestEvaluation = (taskId) => {
            setTasks(tasks.map(task => 
            task.id === taskId ? { ...task, status: STATUS.AGUARDANDO_AVALIACAO, conclusaoRealUser: new Date().toISOString().split('T')[0] } : task
            ));
        };

        const closeTask = (taskId, evaluationData) => {
            setTasks(tasks.map(task => 
            task.id === taskId ? { ...task, ...evaluationData, status: STATUS.CONCLUIDA } : task
            ));
        };

        const updateDeadline = (taskId, newDate) => {
            setTasks(tasks.map(task => 
            task.id === taskId ? { ...task, conclusaoPrevista: newDate } : task
            ));
        };

        return (
            <div className="min-h-screen bg-slate-50/50 text-slate-800 font-sans pb-24 selection:bg-blue-200">
            {/* CABEÇALHO CORPORATIVO (PREMIUM, STICKY & RESPONSIVO) */}
            <header className="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm transition-all">
                {/* max-w-[1800px] garante uso de 100% do layout útil em monitores ultrawide */}
                <div className="w-full max-w-[1800px] mx-auto px-4 py-3 md:py-4 sm:px-6 lg:px-8 xl:px-12 flex flex-row items-center justify-between">
                <div className="flex items-center">
                    <img 
                        src="https://res.cloudinary.com/dbnyxxhe3/image/upload/v1772102800/02_Prancheta_1_ksm9oj.png" 
                        alt="Logo Mais Hidro Soluções" 
                        className="h-10 md:h-12 mr-4 md:mr-6 object-contain" 
                    />
                    <div className="flex flex-col justify-center">
                        <h1 className="text-lg md:text-xl font-extrabold text-[#003865] leading-none tracking-tight mb-1">Controle de Tarefas</h1>
                        <div className="flex items-center text-[10px] md:text-xs font-bold text-slate-500 gap-3 md:gap-4">
                        <span className="flex items-center gap-1 md:gap-1.5">
                            <CalendarDays className="w-3 h-3 md:w-4 md:h-4 text-slate-400" /> Sem {weekNumber}
                        </span>
                        <span className="flex items-center gap-1 md:gap-1.5">
                            <Calendar className="w-3 h-3 md:w-4 md:h-4 text-slate-400" /> {formattedDate}
                        </span>
                        </div>
                    </div>
                </div>
                {/* Pequeno badge extra em telas largas para reforçar premium */}
                <div className="hidden lg:flex items-center px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold border border-blue-100">
                    <Activity className="w-3.5 h-3.5 mr-1.5" /> Operação Ativa
                </div>
                </div>
            </header>

            {/* ÁREA DE CONTEÚDO (100% UTILIZAÇÃO) */}
            <main className="w-full max-w-[1800px] mx-auto px-4 py-6 md:py-8 sm:px-6 lg:px-8 xl:px-12 relative animate-in fade-in duration-500">
                {activeTab === 'dashboard' && <DashboardView tasks={tasks} onRequestEvaluation={requestEvaluation} />}
                {activeTab === 'insert' && <InsertTaskForm onAdd={addTask} objetivos={objetivos} tasks={tasks} />}
                {activeTab === 'manager' && <ManagerPanelView tasks={tasks} onCloseTask={closeTask} onUpdateDeadline={updateDeadline} />}
            </main>

            {/* ========================================================================= */}
            {/* INÍCIO DO BOTÃO FLUTUANTE (FAB MENU REACT)                                */}
            {/* ========================================================================= */}
            <div className="fixed bottom-6 right-4 md:right-8 lg:right-12 xl:right-16 z-[100] flex flex-col items-end font-sans" ref={fabRef}>
                
                {/* Menu Expandido (Opções) */}
                <div className={`flex flex-col gap-3 mb-4 items-end transition-all duration-300 transform ${isFabOpen ? 'translate-y-0 opacity-100 pointer-events-auto' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                
                {/* Link: Gestão à Vista */}
                <button onClick={() => { setActiveTab('dashboard'); setIsFabOpen(false); }} className="flex items-center gap-3 hover:scale-105 transition-transform group">
                    <span className={`${activeTab === 'dashboard' ? 'bg-[#003865] text-white border-[#003865]' : 'bg-white text-slate-700 border-slate-100'} border text-xs md:text-sm font-semibold px-4 py-2 rounded-xl shadow-lg whitespace-nowrap`}>
                    Controle de Tarefas (Início)
                    </span>
                    <div className={`w-12 h-12 md:w-14 md:h-14 rounded-full shadow-lg flex items-center justify-center border border-slate-100 transition-colors ${activeTab === 'dashboard' ? 'bg-[#003865] text-white' : 'bg-white text-[#003865]'}`}>
                    <LayoutDashboard className="w-5 h-5 md:w-6 md:h-6" />
                    </div>
                </button>

                {/* Link: Nova Atividade */}
                <button onClick={() => { setActiveTab('insert'); setIsFabOpen(false); }} className="flex items-center gap-3 hover:scale-105 transition-transform group">
                    <span className={`${activeTab === 'insert' ? 'bg-[#003865] text-white border-[#003865]' : 'bg-white text-slate-700 border-slate-100'} border text-xs md:text-sm font-semibold px-4 py-2 rounded-xl shadow-lg whitespace-nowrap`}>
                    Nova Atividade
                    </span>
                    <div className={`w-12 h-12 md:w-14 md:h-14 rounded-full shadow-lg flex items-center justify-center border border-slate-100 transition-colors ${activeTab === 'insert' ? 'bg-[#003865] text-white' : 'bg-white text-[#003865]'}`}>
                    <PlusCircle className="w-5 h-5 md:w-6 md:h-6" />
                    </div>
                </button>

                {/* Link: Painel do Gestor */}
                <button onClick={() => { setActiveTab('manager'); setIsFabOpen(false); }} className="flex items-center gap-3 hover:scale-105 transition-transform group">
                    <span className={`${activeTab === 'manager' ? 'bg-[#003865] text-white border-[#003865]' : 'bg-white text-slate-700 border-slate-100'} border text-xs md:text-sm font-semibold px-4 py-2 rounded-xl shadow-lg whitespace-nowrap`}>
                    Painel do Gestor
                    </span>
                    <div className={`w-12 h-12 md:w-14 md:h-14 rounded-full shadow-lg flex items-center justify-center border border-slate-100 transition-colors ${activeTab === 'manager' ? 'bg-[#003865] text-white' : 'bg-white text-[#003865]'}`}>
                    <UserCog className="w-5 h-5 md:w-6 md:h-6" />
                    </div>
                </button>
                </div>

                {/* Botão Principal */}
                <button 
                onClick={handleFabClick}
                className={`w-14 h-14 md:w-16 md:h-16 rounded-full shadow-2xl transition-all duration-300 flex items-center justify-center border outline-none hover:scale-105 active:scale-95 ${
                    isFabOpen 
                    ? 'bg-rose-500 text-white border-rose-500 opacity-100 rotate-90' 
                    : 'bg-white text-[#003865] border-slate-200 opacity-90 hover:opacity-100 focus:opacity-100'
                }`}
                title="1 clique para Menu | 2 cliques para Início"
                >
                {isFabOpen ? <X className="w-7 h-7 md:w-8 md:h-8 transition-transform duration-300" /> : <Plus className="w-7 h-7 md:w-8 md:h-8 transition-transform duration-300" />}
                </button>
            </div>
            </div>
        );
        }

        // --- SUB-COMPONENTES ---

        function ToggleSwitch({ label, checked, onChange, icon }) {
        return (
            <div className="flex items-center justify-between p-4 border border-slate-200 rounded-xl bg-white shadow-sm hover:bg-slate-50 transition-colors cursor-pointer" onClick={() => onChange(!checked)}>
            <div className="flex items-center space-x-3 pr-4">
                {icon && <div className="text-slate-400 bg-slate-100 p-2 rounded-lg">{icon}</div>}
                <span className="text-xs md:text-sm font-semibold text-slate-700 leading-tight">{label}</span>
            </div>
            <button
                type="button"
                className={`relative inline-flex h-6 md:h-7 w-11 md:w-12 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${checked ? 'bg-[#003865]' : 'bg-slate-200'}`}
            >
                <span className={`pointer-events-none inline-block h-5 md:h-6 w-5 md:w-6 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${checked ? 'translate-x-5 md:translate-x-5' : 'translate-x-0'}`} />
            </button>
            </div>
        );
        }

        // ABA 1: Formulário de Nova Atividade (Layout Otimizado)
        function InsertTaskForm({ onAdd, objetivos, tasks }) {
        const [isNewObjetivo, setIsNewObjetivo] = useState(false);
        const [hasObjetivo, setHasObjetivo] = useState(false); 
        const [hasDependencia, setHasDependencia] = useState(false); 

        const [formData, setFormData] = useState({
            setorSolicitante: SETORES[0],
            setorExecutor: SETORES[0],
            dataAbertura: new Date().toISOString().split('T')[0], 
            conclusaoPrevista: '',
            complexidade: COMPLEXIDADES[0],
            descricao: '',
            objetivo: objetivos[0] || '', 
            clienteFornecedor: '',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: false,
            tipoCusto: '',
            valorCusto: '',
            dependencia: '' 
        });

        const handleChange = (e) => {
            const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
            setFormData({ ...formData, [e.target.name]: value });
        };

        const handleToggle = (name, value) => {
            setFormData({ ...formData, [name]: value });
        };

        const handleSubmit = (e) => {
            e.preventDefault();
            onAdd({
            ...formData,
            objetivo: hasObjetivo ? formData.objetivo : '' 
            });
        };

        const inputClass = "mt-1 block w-full rounded-lg border-slate-300 bg-white py-3 px-4 text-sm text-slate-900 shadow-sm focus:border-[#003865] focus:outline-none focus:ring-1 focus:ring-[#003865] transition-colors border";
        const labelClass = "block text-[10px] md:text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5";

        return (
            <div className="w-full max-w-5xl mx-auto">
            <div className="mb-6 md:mb-8 text-center md:text-left">
                <h2 className="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">Cadastrar Nova Atividade</h2>
                <p className="text-slate-500 text-sm mt-2">Preencha os detalhes abaixo para registrar uma nova demanda no quadro geral.</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
                
                {/* BLOCO 1: Atribuição e Prazos */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                <div className="bg-slate-50/80 border-b border-slate-200 px-5 md:px-8 py-4 flex items-center">
                    <Settings2 className="w-5 h-5 text-[#003865] mr-3" />
                    <h3 className="text-sm md:text-base font-bold text-slate-800">Atribuição e Prazos</h3>
                </div>
                <div className="p-5 md:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
                    <div>
                    <label className={labelClass}>Setor Solicitante</label>
                    <select name="setorSolicitante" value={formData.setorSolicitante} onChange={handleChange} className={inputClass}>
                        {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                    </div>
                    <div>
                    <label className={labelClass}>Setor Executor</label>
                    <select name="setorExecutor" value={formData.setorExecutor} onChange={handleChange} className={inputClass}>
                        {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                    </div>
                    <div>
                    <label className={labelClass}>Complexidade</label>
                    <select name="complexidade" value={formData.complexidade} onChange={handleChange} className={inputClass}>
                        {COMPLEXIDADES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    </div>
                    <div className="lg:col-span-1 md:col-span-2 grid grid-cols-2 gap-4 lg:col-start-1 lg:col-end-4">
                    <div>
                        <label className={labelClass}>Data de Abertura</label>
                        <input type="date" name="dataAbertura" value={formData.dataAbertura} onChange={handleChange} required className={inputClass} />
                    </div>
                    <div>
                        <label className={labelClass}>Conclusão Prevista</label>
                        <input type="date" name="conclusaoPrevista" value={formData.conclusaoPrevista} onChange={handleChange} required className={`${inputClass} border-blue-200 bg-blue-50/50`} />
                    </div>
                    </div>
                </div>
                </div>

                {/* BLOCO 2: Escopo da Atividade */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                <div className="bg-slate-50/80 border-b border-slate-200 px-5 md:px-8 py-4 flex items-center">
                    <FileText className="w-5 h-5 text-[#003865] mr-3" />
                    <h3 className="text-sm md:text-base font-bold text-slate-800">Escopo da Atividade</h3>
                </div>
                <div className="p-5 md:p-8 space-y-6">
                    <div>
                    <label className={labelClass}>Descrição Detalhada</label>
                    <textarea name="descricao" value={formData.descricao} onChange={handleChange} required rows={4} className={inputClass} placeholder="Descreva claramente o que precisa ser entregue..." />
                    </div>
                    
                    {/* NOVO SISTEMA INTELIGENTE DE DEPENDÊNCIA */}
                    <div className="pt-4 border-t border-slate-100">
                    <ToggleSwitch 
                        label="Esta atividade possui uma Dependência (Pré-requisito)?" 
                        checked={hasDependencia} 
                        onChange={(val) => {
                        setHasDependencia(val);
                        if(!val) setFormData({...formData, dependencia: ''}); // Limpa se desmarcar
                        }} 
                        icon={<Lock className="w-5 h-5" />} 
                    />
                    
                    {hasDependencia && (
                        <div className="mt-4 bg-amber-50/80 border border-amber-200 rounded-xl p-5 md:p-6 animate-in fade-in slide-in-from-top-2">
                        <label className="block text-[11px] md:text-xs font-bold text-amber-800 uppercase tracking-wider mb-3">
                            Qual atividade de qual setor deve ser concluída primeiro?
                        </label>
                        <select 
                            name="dependencia" 
                            value={formData.dependencia} 
                            onChange={handleChange} 
                            required={hasDependencia}
                            className="block w-full rounded-lg border-amber-300 bg-white py-3 px-4 text-sm text-slate-900 shadow-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500"
                        >
                            <option value="" disabled>Selecione a atividade bloqueadora...</option>
                            {tasks.filter(t => t.status !== STATUS.CONCLUIDA).length === 0 && (
                            <option value="" disabled>Não há atividades pendentes em andamento.</option>
                            )}
                            {tasks.filter(t => t.status !== STATUS.CONCLUIDA).map(t => (
                            <option key={t.id} value={t.id}>
                                [{t.setorExecutor}] - {t.descricao.length > 80 ? t.descricao.substring(0, 80) + '...' : t.descricao}
                            </option>
                            ))}
                        </select>
                        <div className="flex items-start mt-3 text-amber-700 bg-white/50 p-3 rounded-lg border border-amber-100/50">
                            <Lock className="w-4 h-4 mr-2 mt-0.5 flex-shrink-0" />
                            <p className="text-[11px] md:text-xs font-medium leading-relaxed">
                            A sua atividade ficará <strong>bloqueada</strong> no quadro até que o gestor dê a baixa final na atividade selecionada acima.
                            </p>
                        </div>
                        </div>
                    )}
                    </div>

        // Sub-componente para os Cards de Resumo (Otimizado)

        // ABA 2: Gestão à Vista (Quadro Kanban - 100% Full Width & Mobile Friendly)
        function DashboardView({ tasks, onRequestEvaluation }) {
        const pendingTasks = tasks.filter(t => t.status === STATUS.PENDENTE);
        const reviewTasks = tasks.filter(t => t.status === STATUS.AGUARDANDO_AVALIACAO);
        const doneTasks = tasks.filter(t => t.status === STATUS.CONCLUIDA);

        const today = new Date().toISOString().split('T')[0];
        const totalAtividades = tasks.length;
        const atrasadas = tasks.filter(t => t.conclusaoPrevista < today && t.status === STATUS.PENDENTE).length;
        const geramCusto = tasks.filter(t => t.geraCusto).length;

        const totalDone = doneTasks.length;
        const totalOnTime = doneTasks.filter(t => t.conclusaoReal <= t.conclusaoPrevista).length;
        const globalRate = totalDone > 0 ? Math.round((totalOnTime / totalDone) * 100) : 0;

        const sectorStats = SETORES.map(setor => {
            const completedBySector = doneTasks.filter(t => t.setorExecutor === setor);
            const onTime = completedBySector.filter(t => t.conclusaoReal <= t.conclusaoPrevista).length;
            const total = completedBySector.length;
            const rate = total > 0 ? Math.round((onTime / total) * 100) : 0;
            return { setor, total, onTime, rate };
        }).filter(s => s.total > 0).sort((a, b) => b.rate - a.rate || b.total - a.total);

        return (
            <div className="w-full flex flex-col space-y-6 md:space-y-8">
            
            {/* KPI Cards / Resumo Rápido */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <SummaryCard title="Total Ativas" value={totalAtividades} icon={<Activity className="w-6 h-6 md:w-8 md:h-8 text-blue-600" />} colorClass="bg-blue-50 border border-blue-100" />

                <SummaryCard title="Geram Custo" value={geramCusto} icon={<DollarSign className="w-6 h-6 md:w-8 md:h-8 text-orange-600" />} colorClass="bg-orange-50 border border-orange-100" />
            </div>

            {/* Quadro Grid: Usando 100% da largura no desktop. No mobile, empilha. */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 items-start">
                
                {/* Coluna Pendente */}
                <div className="bg-slate-100/80 rounded-2xl p-4 md:p-5 border border-slate-200 shadow-sm flex flex-col h-full lg:max-h-[75vh] overflow-hidden">
                <div className="flex items-center justify-between mb-4 md:mb-5 pb-3 border-b-2 border-slate-300">
                    <h3 className="text-base md:text-lg font-extrabold text-slate-700 flex items-center"><Clock className="w-5 h-5 md:w-6 md:h-6 mr-2 text-blue-600"/> Em Andamento</h3>
                    <span className="bg-slate-200 text-slate-700 py-1 px-3 rounded-full text-xs font-black shadow-sm">{pendingTasks.length}</span>
                </div>
                {/* Scroll vertical interno na coluna para Desktop, scroll natural no Mobile */}
                <div className="space-y-4 md:space-y-5 overflow-y-auto pr-1 pb-4 flex-1 custom-scrollbar">
                    {pendingTasks.length === 0 && <p className="text-sm md:text-base text-slate-400 text-center py-8 font-medium">Nenhuma tarefa pendente.</p>}
                    {pendingTasks.map(task => {
                    const parentTask = task.dependencia ? tasks.find(t => t.id === task.dependencia) : null;
                    const isBlocked = parentTask && parentTask.status !== STATUS.CONCLUIDA;
                    return (
                        <TaskCard 
                        key={task.id} 
                        task={task} 
                        onAction={() => onRequestEvaluation(task.id)} 
                        actionLabel="Finalizar Tarefa"

                </div>

                {/* Coluna Aguardando Avaliação */}
                <div className="bg-amber-50/60 rounded-2xl p-4 md:p-5 border border-amber-100 shadow-sm flex flex-col h-full lg:max-h-[75vh] overflow-hidden">

                    <span className="bg-amber-200 text-amber-900 py-1 px-3 rounded-full text-xs font-black shadow-sm">{reviewTasks.length}</span>

                {/* NOVA COLUNA: Ranking Público de Desempenho */}
                <div className="bg-emerald-50/60 rounded-2xl p-4 md:p-5 border border-emerald-100 shadow-sm flex flex-col h-full lg:max-h-[75vh] overflow-hidden">
                <div className="flex items-center justify-between mb-4 md:mb-5 pb-3 border-b-2 border-emerald-200">
                    <h3 className="text-base md:text-lg font-extrabold text-emerald-800 flex items-center"><Trophy className="w-5 h-5 md:w-6 md:h-6 mr-2 text-emerald-600"/> Desempenho (KPI)</h3>
                </div>

                {/* Destaque da Taxa Global */}
                <div className="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-emerald-100 mb-5 text-center flex flex-col items-center justify-center">
                    <div className="text-4xl md:text-5xl font-black text-emerald-600 tracking-tighter">{globalRate}%</div>
                    <div className="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mt-2 text-center leading-tight">Taxa Global de Entregas no Prazo</div>
                </div>

                {/* Lista do Ranking por Setor */}
                <div className="space-y-3 md:space-y-4 overflow-y-auto pr-1 pb-4 flex-1 custom-scrollbar">
                    {sectorStats.length === 0 && <p className="text-sm md:text-base text-emerald-600/60 text-center py-8 font-medium">Sem dados finalizados.</p>}
                    {sectorStats.map((stat, index) => (
                        <div key={stat.setor} className="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-100 relative overflow-hidden transition-transform hover:-translate-y-1 hover:shadow-md">

                        <div className="w-full bg-slate-100 rounded-full h-2.5 md:h-3 mb-2 overflow-hidden shadow-inner">

                                className={`h-full rounded-full transition-all duration-1000 ${stat.rate >= 80 ? 'bg-emerald-500' : stat.rate >= 50 ? 'bg-amber-400' : 'bg-rose-500'}`}

                            ></div>

                        <div className="flex justify-between items-center text-[10px] md:text-[11px] font-bold uppercase tracking-wider">
                            <span className="text-slate-400">Eficiência</span>
                            <span className={stat.rate >= 80 ? 'text-emerald-600' : stat.rate >= 50 ? 'text-amber-600' : 'text-rose-600'}>
                            {stat.rate}% no prazo
                            </span>
                        </div>
                        </div>
                    ))}
                </div>
                </div>
            </div>

            {/* Estilo embutido para scrollbars bonitas no Desktop */}
            <style dangerouslySetInnerHTML={{__html: `
                .custom-scrollbar::-webkit-scrollbar { width: 6px; }
                .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
                .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
            `}} />
            </div>
        );
        }

        // Cartão Individual da Tarefa (Card Otimizado)
        function TaskCard({ task, onAction, actionLabel, isReview, isDone, isBlocked, parentTask }) {
        const today = new Date().toISOString().split('T')[0];
        const isOverdue = task.conclusaoPrevista < today && task.status === STATUS.PENDENTE;

        return (
            <div className={`bg-white p-4 md:p-5 rounded-2xl shadow-sm border-l-4 transition-all hover:shadow-md relative overflow-hidden ${
            isBlocked ? 'border-l-amber-500 opacity-95' :
            isOverdue ? 'border-l-rose-500' : 
            isDone ? 'border-l-emerald-500' : 
            isReview ? 'border-l-amber-400' : 'border-l-blue-600'
            }`}>
            <div className="flex justify-between items-start mb-3 gap-2">
                <span className="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] md:text-xs font-bold bg-slate-100 text-slate-700 uppercase tracking-wider truncate" title={`Solicitante: ${task.setorSolicitante} | Executor: ${task.setorExecutor}`}>
                {task.setorSolicitante !== task.setorExecutor 
                    ? `${task.setorSolicitante.substring(0,3)} ➔ ${task.setorExecutor}` 
                    : task.setorExecutor}
                </span>
                <span className={`text-[10px] md:text-xs font-black px-2.5 py-1 rounded-md uppercase tracking-wider flex-shrink-0 ${
                task.complexidade === 'Alta' ? 'bg-rose-100 text-rose-800' : 
                task.complexidade === 'Média' ? 'bg-orange-100 text-orange-800' : 'bg-emerald-100 text-emerald-800'
                }`}>
                {task.complexidade}
                </span>
            </div>
            
            <p className="text-sm md:text-base font-bold text-slate-800 mb-3 line-clamp-3 leading-snug">{task.descricao}</p>
            
            <div className="text-[11px] md:text-xs text-slate-500 mb-4 space-y-1.5 md:space-y-2">
                {task.objetivo && (
                <div className="flex items-center font-bold text-[#003865] bg-[#003865]/5 w-fit px-2.5 py-1 rounded-md"><Target className="w-3.5 h-3.5 mr-1.5" /> Obj: {task.objetivo}</div>
                )}
                <div className="flex items-center font-medium"><Calendar className="w-3.5 h-3.5 mr-1.5 text-slate-400" /> Previsto: <strong className="ml-1 text-slate-700">{new Date(task.conclusaoPrevista).toLocaleDateString('pt-BR')}</strong></div>
                {task.clienteFornecedor && <div className="flex items-center font-medium"><UserCog className="w-3.5 h-3.5 mr-1.5 text-slate-400" /> <span className="truncate">{task.clienteFornecedor}</span></div>}
                
                {task.deslocamento && (
                <div className="flex items-center text-indigo-700 font-medium">
                    <Truck className="w-3.5 h-3.5 mr-1.5 flex-shrink-0" /> 
                    <span className="truncate">{task.local} {task.duracaoDeslocamento && `(${task.duracaoDeslocamento} ${task.unidadeDeslocamento})`}</span>
                </div>
                )}
                {task.geraCusto && (
                <div className="flex items-center text-orange-700 font-medium">
                    <DollarSign className="w-3.5 h-3.5 mr-1.5 flex-shrink-0" /> 
                    <span className="truncate">{task.valorCusto ? `R$ ${task.valorCusto}` : 'Com custo'} - {task.tipoCusto}</span>
                </div>

            {isOverdue && !isBlocked && (
                <div className="mb-4 text-[11px] md:text-xs font-black text-rose-600 flex items-center bg-rose-50 p-2 rounded-lg border border-rose-100 uppercase tracking-wider">
                <AlertTriangle className="w-4 h-4 mr-1.5" /> Atrasada!
                </div>
            )}

            {isBlocked && parentTask && (
                <div className="mb-4 text-[11px] md:text-xs font-bold text-amber-800 flex flex-col bg-amber-50 p-2.5 rounded-lg border border-amber-200 shadow-sm">
                <span className="flex items-center mb-1.5 text-amber-600 uppercase tracking-wider text-[10px]"><Lock className="w-3.5 h-3.5 mr-1.5" /> Bloqueada por:</span>
                <span className="font-medium text-amber-900 line-clamp-2 leading-tight">[{parentTask.setorExecutor}] {parentTask.descricao}</span>
                </div>
            )}

            {onAction && (
                <button 
                onClick={onAction} 
                disabled={isBlocked}
                className={`w-full font-bold py-2.5 px-4 rounded-xl text-xs md:text-sm transition-all transform active:scale-95 ${
                    isBlocked 
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200' 
                    : 'bg-[#003865] text-white hover:bg-blue-800 shadow-md hover:shadow-lg'

                >
                {isBlocked ? 'Aguardando Liberação' : actionLabel}
                </button>
            )}
            
            {isReview && <div className="text-xs font-bold text-center bg-amber-100 text-amber-800 py-2 rounded-xl border border-amber-200 uppercase tracking-widest">Aguardando Avaliação</div>}
            {isDone && <div className="text-xs font-bold text-center bg-emerald-100 text-emerald-800 py-2 rounded-xl border border-emerald-200 uppercase tracking-widest flex items-center justify-center"><CheckCircle className="w-3.5 h-3.5 mr-1.5"/>Aprovada</div>}
            </div>
        );
        }

        // ABA 3: Painel do Gestor (DUAS EXPERIÊNCIAS: DESKTOP TABELA vs MOBILE CARDS)
        function ManagerPanelView({ tasks, onCloseTask, onUpdateDeadline }) {
        const [evaluatingTask, setEvaluatingTask] = useState(null);

        const today = new Date().toISOString().split('T')[0];
        const pendingTasks = tasks.filter(t => t.status === STATUS.PENDENTE);
        const reviewTasks = tasks.filter(t => t.status === STATUS.AGUARDANDO_AVALIACAO);
        const doneTasks = tasks.filter(t => t.status === STATUS.CONCLUIDA);

        const overdueTasks = pendingTasks.filter(t => t.conclusaoPrevista < today);
        const onTimeDeliveries = doneTasks.filter(t => t.conclusaoReal <= t.conclusaoPrevista);
        const onTimeRate = doneTasks.length > 0 ? Math.round((onTimeDeliveries.length / doneTasks.length) * 100) : 0;

        const workloadGrid = SETORES.map(setor => {
            const tasksAsExecutor = tasks.filter(t => t.setorExecutor === setor);
            const tasksAsSolicitante = tasks.filter(t => t.setorSolicitante === setor && t.setorExecutor !== setor);
            return {
            setor,
            totalRegistradas: tasksAsExecutor.length,
            concluidas: tasksAsExecutor.filter(t => t.status === STATUS.CONCLUIDA).length,
            atrasadas: tasksAsExecutor.filter(t => t.conclusaoPrevista < today && t.status === STATUS.PENDENTE).length,
            apoioAOutros: tasksAsExecutor.filter(t => t.setorSolicitante !== setor).length,
            demandouParaOutros: tasksAsSolicitante.length
            };
        }).filter(w => w.totalRegistradas > 0 || w.demandouParaOutros > 0).sort((a, b) => b.totalRegistradas - a.totalRegistradas);

        // Define as cores dos Status para uso nas Tabelas e Mobile Cards
        const statusClasses = {
            [STATUS.CONCLUIDA]: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            [STATUS.AGUARDANDO_AVALIACAO]: 'bg-amber-50 text-amber-700 border-amber-200',
            [STATUS.PENDENTE]: 'bg-slate-50 text-slate-600 border-slate-200'
        };

        const EvaluationModal = ({ task, onClose }) => {
            const [evalData, setEvalData] = useState({
            avaliacao: '',
            dataAvaliacao: new Date().toISOString().split('T')[0],
            conclusaoReal: task.conclusaoRealUser || new Date().toISOString().split('T')[0],
            necessitaAjuste: false,
            encaminhamento: ''
            });

            const handleSubmit = (e) => {
            e.preventDefault();
            onCloseTask(task.id, evalData);
