<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Tarefas</title>
    
    <!-- Carrega o Tailwind CSS para os estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carrega o Babel para traduzir o React (JSX) diretamente no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Configura as importações para o navegador entender de onde puxar o React e os Ícones -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
</head>
<body>
    <!-- Aqui é onde o React vai injetar a aplicação -->
    <div id="root"></div>

    <!-- Script principal com o SEU CÓDIGO EXATAMENTE COMO ESTÁ -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client'; // Necessário para injetar o React no HTML
        import { LayoutDashboard, PlusCircle, UserCog, AlertCircle, CheckCircle, Clock, Calendar, MapPin, DollarSign, Activity, TrendingUp, AlertTriangle, BarChart3, Target, FileText, Settings2, Truck, Lock, Plus, X, CalendarDays, Trophy } from 'lucide-react';

        // --- CONSTANTES E DADOS GERAIS ---
        const SETORES = ['Administração', 'Comercial', 'Compras', 'Financeiro', 'Produção', 'PD_I', 'Automação', 'Logística'];
        const COMPLEXIDADES = ['Baixa', 'Média', 'Alta'];
        const STATUS = {
        PENDENTE: 'Pendente',
        AGUARDANDO_AVALIACAO: 'Aguardando Avaliação',
        CONCLUIDA: 'Concluída'
        };

        // --- DADOS DE EXEMPLO (MOCK DATA) ---
        const todayStr = new Date().toISOString().split('T')[0];
        const yesterdayDate = new Date();
        yesterdayDate.setDate(yesterdayDate.getDate() - 2);
        const yesterdayStr = yesterdayDate.toISOString().split('T')[0];
        const nextWeekDate = new Date();
        nextWeekDate.setDate(nextWeekDate.getDate() + 5);
        const nextWeekStr = nextWeekDate.toISOString().split('T')[0];

        // --- DADOS DE OBJETIVOS MACRO ---
        const INITIAL_OBJETIVOS = ['Fábrica Principal', 'Proposta 2026/05', 'Geral', 'Logística Regional'];

        const INITIAL_TASKS = [
        {
            id: '1',
            setorSolicitante: 'Produção',
            setorExecutor: 'Produção',
            dataAbertura: yesterdayStr,
            conclusaoPrevista: yesterdayStr, // Atrasada (Vencida a 2 dias)
            complexidade: 'Alta',
            descricao: 'Manutenção preventiva na linha de montagem principal. Substituição de correias.',
            objetivo: 'Fábrica Principal',
            clienteFornecedor: 'Equipe Interna',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: true,
            tipoCusto: 'Peças de reposição (Correias)',
            valorCusto: '800.00',
            dependencia: '', // Sem dependência
            status: STATUS.PENDENTE
        },
        {
            id: '2',
            setorSolicitante: 'Comercial',
            setorExecutor: 'Comercial',
            dataAbertura: todayStr,
            conclusaoPrevista: nextWeekStr, // No prazo
            complexidade: 'Média',
            descricao: 'Apresentação comercial e fechamento de contrato com novo cliente VIP.',
            objetivo: 'Proposta 2026/05',
            clienteFornecedor: 'Empresa Tech SA',
            deslocamento: true,
            local: 'Sede do Cliente (São Paulo)',
            duracaoDeslocamento: '4',
            unidadeDeslocamento: 'Horas',
            geraCusto: true,
            tipoCusto: 'Transporte e Alimentação',
            valorCusto: '150.00',
            dependencia: '1', // Inteligência: ID '1' = Depende da Manutenção (Produção)
            status: STATUS.PENDENTE
        },
        {
            id: '3',
            setorSolicitante: 'Financeiro',
            setorExecutor: 'Compras',
            dataAbertura: yesterdayStr,
            conclusaoPrevista: nextWeekStr,
            complexidade: 'Baixa',
            descricao: 'Cotação e compra de novos equipamentos de proteção individual (EPIs).',
            objetivo: 'Geral',
            clienteFornecedor: 'Diversos Fornecedores',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: true,
            tipoCusto: 'Compra de Material',
            valorCusto: '2500.00',
            dependencia: '',
            status: STATUS.AGUARDANDO_AVALIACAO,
            conclusaoRealUser: todayStr
        },
        {
            id: '4',
            setorSolicitante: 'Logística',
            setorExecutor: 'Logística',
            dataAbertura: '2026-05-01',
            conclusaoPrevista: '2026-05-15',
            complexidade: 'Média',
            descricao: 'Otimização das rotas de entrega semanais na região sul.',
            objetivo: 'Logística Regional',
            clienteFornecedor: 'Transportadoras Parceiras',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: false,
            tipoCusto: '',
            valorCusto: '',
            dependencia: '',
            status: STATUS.CONCLUIDA,
            avaliacao: 'As rotas foram bem desenhadas, tivemos uma economia de 10% no tempo.',
            dataAvaliacao: '2026-05-16',
            conclusaoReal: '2026-05-14',
            necessitaAjuste: false,
            encaminhamento: 'Monitorar os resultados de entrega durante o próximo mês.'
        }
        ];

        // --- FUNÇÃO AUXILIAR PARA DATA E SEMANA ---
        const getWeekNumber = (d) => {
        const date = new Date(d.getTime());
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
        const week1 = new Date(date.getFullYear(), 0, 4);
        return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        };

        // --- COMPONENTE PRINCIPAL ---
        export default function App() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [tasks, setTasks] = useState(INITIAL_TASKS);
        const [objetivos, setObjetivos] = useState(INITIAL_OBJETIVOS);

        // Inteligência do Cabeçalho (Data e Semana Dinâmicas)
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
        const weekNumber = getWeekNumber(currentDate);

        // Estados e Refs para o Menu Flutuante (FAB)
        const [isFabOpen, setIsFabOpen] = useState(false);
        const fabRef = useRef(null);
        const clickTimer = useRef(null);

        // Lógica de fechamento do menu ao clicar fora (traduzido do seu JS)
        useEffect(() => {
            const handleClickOutside = (event) => {
            if (fabRef.current && !fabRef.current.contains(event.target)) {
                setIsFabOpen(false);
            }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        // Lógica Inteligente do Botão: 1 Clique vs 2 Cliques
        const handleFabClick = (e) => {
            e.preventDefault();
            if (clickTimer.current === null) {
            clickTimer.current = setTimeout(() => {
                setIsFabOpen(!isFabOpen);
                clickTimer.current = null;
            }, 250);
            } else {
            // Duplo clique - Redireciona para o início (Dashboard)
            clearTimeout(clickTimer.current);
            clickTimer.current = null;
            setActiveTab('dashboard');
            setIsFabOpen(false);
            }
        };

        const addTask = (newTask) => {
            if (newTask.objetivo && !objetivos.includes(newTask.objetivo)) {
            setObjetivos([...objetivos, newTask.objetivo]);
            }
            const taskWithMeta = {
            ...newTask,
            id: Date.now().toString(),
            status: STATUS.PENDENTE,
            };
            setTasks([...tasks, taskWithMeta]);
            setActiveTab('dashboard'); 
        };

        const requestEvaluation = (taskId) => {
            setTasks(tasks.map(task => 
            task.id === taskId ? { ...task, status: STATUS.AGUARDANDO_AVALIACAO, conclusaoRealUser: new Date().toISOString().split('T')[0] } : task
            ));
        };

        const closeTask = (taskId, evaluationData) => {
            setTasks(tasks.map(task => 
            task.id === taskId ? { ...task, ...evaluationData, status: STATUS.CONCLUIDA } : task
            ));
        };

        const updateDeadline = (taskId, newDate) => {
            setTasks(tasks.map(task => 
            task.id === taskId ? { ...task, conclusaoPrevista: newDate } : task
            ));
        };

        return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-24">
            {/* CABEÇALHO CORPORATIVO (IDÊNTICO À IMAGEM) */}
            <header className="bg-white border-b border-slate-200">
                <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex items-center">
                <img 
                    src="https://res.cloudinary.com/dbnyxxhe3/image/upload/v1772102800/02_Prancheta_1_ksm9oj.png" 
                    alt="Logo Mais Hidro Soluções" 
                    className="h-12 mr-6 object-contain" 
                />
                <div className="flex flex-col justify-center">
                    <h1 className="text-xl font-extrabold text-[#003865] leading-none tracking-tight mb-1.5">Controle de Tarefas</h1>
                    <div className="flex items-center text-xs font-bold text-slate-500 gap-4">
                    <span className="flex items-center gap-1.5">
                        <CalendarDays className="w-4 h-4 text-slate-400" /> Semana {weekNumber}
                    </span>
                    <span className="flex items-center gap-1.5">
                        <Calendar className="w-4 h-4 text-slate-400" /> {formattedDate}
                    </span>
                    </div>
                </div>
                </div>
            </header>

            {/* ÁREA DE CONTEÚDO */}
            <main className="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 relative">
                {activeTab === 'dashboard' && <DashboardView tasks={tasks} onRequestEvaluation={requestEvaluation} />}
                {activeTab === 'insert' && <InsertTaskForm onAdd={addTask} objetivos={objetivos} tasks={tasks} />}
                {activeTab === 'manager' && <ManagerPanelView tasks={tasks} onCloseTask={closeTask} onUpdateDeadline={updateDeadline} />}
            </main>

            {/* ========================================================================= */}
            {/* INÍCIO DO BOTÃO FLUTUANTE (FAB MENU REACT)                                */}
            {/* ========================================================================= */}
            <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end font-sans" ref={fabRef}>
                
                {/* Menu Expandido (Opções) */}
                <div className={`flex flex-col gap-3 mb-4 items-end transition-all duration-300 transform ${isFabOpen ? 'translate-y-0 opacity-100 pointer-events-auto' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                
                {/* Link: Gestão à Vista */}
                <button onClick={() => { setActiveTab('dashboard'); setIsFabOpen(false); }} className="flex items-center gap-3 hover:scale-105 transition-transform group">
                    <span className={`${activeTab === 'dashboard' ? 'bg-blue-800 text-white border-blue-800' : 'bg-white text-slate-700 border-slate-100'} border text-xs md:text-sm font-semibold px-3 py-1.5 rounded-lg shadow-sm whitespace-nowrap`}>
                    Controle de Tarefas (Início)
                    </span>
                    <div className={`w-12 h-12 rounded-full shadow-md flex items-center justify-center border border-slate-100 ${activeTab === 'dashboard' ? 'bg-blue-800 text-white' : 'bg-white text-blue-600'}`}>
                    <LayoutDashboard className="w-5 h-5" />
                    </div>
                </button>

                {/* Link: Nova Atividade */}
                <button onClick={() => { setActiveTab('insert'); setIsFabOpen(false); }} className="flex items-center gap-3 hover:scale-105 transition-transform group">
                    <span className={`${activeTab === 'insert' ? 'bg-blue-800 text-white border-blue-800' : 'bg-white text-slate-700 border-slate-100'} border text-xs md:text-sm font-semibold px-3 py-1.5 rounded-lg shadow-sm whitespace-nowrap`}>
                    Nova Atividade
                    </span>
                    <div className={`w-12 h-12 rounded-full shadow-md flex items-center justify-center border border-slate-100 ${activeTab === 'insert' ? 'bg-blue-800 text-white' : 'bg-white text-blue-600'}`}>
                    <PlusCircle className="w-5 h-5" />
                    </div>
                </button>

                {/* Link: Painel do Gestor */}
                <button onClick={() => { setActiveTab('manager'); setIsFabOpen(false); }} className="flex items-center gap-3 hover:scale-105 transition-transform group">
                    <span className={`${activeTab === 'manager' ? 'bg-blue-800 text-white border-blue-800' : 'bg-white text-slate-700 border-slate-100'} border text-xs md:text-sm font-semibold px-3 py-1.5 rounded-lg shadow-sm whitespace-nowrap`}>
                    Painel do Gestor
                    </span>
                    <div className={`w-12 h-12 rounded-full shadow-md flex items-center justify-center border border-slate-100 ${activeTab === 'manager' ? 'bg-blue-800 text-white' : 'bg-white text-blue-600'}`}>
                    <UserCog className="w-5 h-5" />
                    </div>
                </button>
                </div>

                {/* Botão Principal (+ transparente, azul ao passar o rato ou quando aberto) */}
                <button 
                onClick={handleFabClick}
                className={`w-14 h-14 md:w-16 md:h-16 rounded-full shadow-xl transition-all duration-300 flex items-center justify-center border outline-none hover:scale-105 active:scale-95 ${
                    isFabOpen 
                    ? 'bg-blue-600 text-white border-blue-600 opacity-100' 
                    : 'bg-white text-blue-600 border-slate-200 opacity-60 hover:opacity-100 focus:opacity-100'
                }`}
                title="1 clique para Menu | 2 cliques para Início"
                >
                {isFabOpen ? <X className="w-8 h-8 transition-transform duration-300 rotate-90" /> : <Plus className="w-8 h-8 transition-transform duration-300" />}
                </button>
            </div>
            {/* ========================================================================= */}
            {/* FIM DO BOTÃO FLUTUANTE                                                    */}
            {/* ========================================================================= */}
            </div>
        );
        }

        // --- SUB-COMPONENTES ---

        // Componente Auxiliar: Interruptor Moderno (Toggle)
        function ToggleSwitch({ label, checked, onChange, icon }) {
        return (
            <div className="flex items-center justify-between p-4 border border-slate-200 rounded-lg bg-slate-50/50 hover:bg-slate-50 transition-colors cursor-pointer" onClick={() => onChange(!checked)}>
            <div className="flex items-center space-x-3">
                {icon && <div className="text-slate-500">{icon}</div>}
                <span className="text-sm font-semibold text-slate-700">{label}</span>
            </div>
            <button
                type="button"
                className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 ${checked ? 'bg-blue-600' : 'bg-slate-300'}`}
            >
                <span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${checked ? 'translate-x-5' : 'translate-x-0'}`} />
            </button>
            </div>
        );
        }

        // ABA 1: Formulário de Nova Atividade
        function InsertTaskForm({ onAdd, objetivos, tasks }) {
        const [isNewObjetivo, setIsNewObjetivo] = useState(false);
        const [hasObjetivo, setHasObjetivo] = useState(false); 
        const [hasDependencia, setHasDependencia] = useState(false); 

        const [formData, setFormData] = useState({
            setorSolicitante: SETORES[0],
            setorExecutor: SETORES[0],
            dataAbertura: new Date().toISOString().split('T')[0], 
            conclusaoPrevista: '',
            complexidade: COMPLEXIDADES[0],
            descricao: '',
            objetivo: objetivos[0] || '', 
            clienteFornecedor: '',
            deslocamento: false,
            local: '',
            duracaoDeslocamento: '',
            unidadeDeslocamento: 'Horas',
            geraCusto: false,
            tipoCusto: '',
            valorCusto: '',
            dependencia: '' 
        });

        const handleChange = (e) => {
            const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
            setFormData({ ...formData, [e.target.name]: value });
        };

        const handleToggle = (name, value) => {
            setFormData({ ...formData, [name]: value });
        };

        const handleSubmit = (e) => {
            e.preventDefault();
            onAdd({
            ...formData,
            objetivo: hasObjetivo ? formData.objetivo : '' 
            });
        };

        const inputClass = "mt-1 block w-full rounded-md border-slate-300 bg-white py-2.5 px-3 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors border";
        const labelClass = "block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1";

        return (
            <div className="max-w-4xl mx-auto">
            <div className="mb-6">
                <h2 className="text-2xl font-bold text-slate-800">Cadastrar Nova Atividade</h2>
                <p className="text-slate-500 text-sm mt-1">Preencha os detalhes abaixo para registrar uma nova demanda no quadro geral.</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-6">
                
                {/* BLOCO 1: Atribuição e Prazos */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50/50 border-b border-slate-200 px-6 py-4 flex items-center">
                    <Settings2 className="w-5 h-5 text-blue-600 mr-2" />
                    <h3 className="text-sm font-bold text-slate-800">Atribuição e Prazos</h3>
                </div>
                <div className="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                    <label className={labelClass}>Setor Solicitante</label>
                    <select name="setorSolicitante" value={formData.setorSolicitante} onChange={handleChange} className={inputClass}>
                        {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                    </div>
                    <div>
                    <label className={labelClass}>Setor Executor</label>
                    <select name="setorExecutor" value={formData.setorExecutor} onChange={handleChange} className={inputClass}>
                        {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                    </div>
                    <div>
                    <label className={labelClass}>Complexidade</label>
                    <select name="complexidade" value={formData.complexidade} onChange={handleChange} className={inputClass}>
                        {COMPLEXIDADES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    </div>
                    <div className="lg:col-span-1 md:col-span-2 grid grid-cols-2 gap-4 lg:col-start-1 lg:col-end-4">
                    <div>
                        <label className={labelClass}>Data de Abertura</label>
                        <input type="date" name="dataAbertura" value={formData.dataAbertura} onChange={handleChange} required className={inputClass} />
                    </div>
                    <div>
                        <label className={labelClass}>Conclusão Prevista</label>
                        <input type="date" name="conclusaoPrevista" value={formData.conclusaoPrevista} onChange={handleChange} required className={`${inputClass} border-blue-200 bg-blue-50/30`} />
                    </div>
                    </div>
                </div>
                </div>

                {/* BLOCO 2: Escopo da Atividade */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50/50 border-b border-slate-200 px-6 py-4 flex items-center">
                    <FileText className="w-5 h-5 text-blue-600 mr-2" />
                    <h3 className="text-sm font-bold text-slate-800">Escopo da Atividade</h3>
                </div>
                <div className="p-6 space-y-6">
                    <div>
                    <label className={labelClass}>Descrição Detalhada</label>
                    <textarea name="descricao" value={formData.descricao} onChange={handleChange} required rows={3} className={inputClass} placeholder="Descreva claramente o que precisa ser entregue..." />
                    </div>
                    
                    {/* NOVO SISTEMA INTELIGENTE DE DEPENDÊNCIA */}
                    <div className="pt-2 border-t border-slate-100">
                    <ToggleSwitch 
                        label="Esta atividade possui uma Dependência (Pré-requisito)?" 
                        checked={hasDependencia} 
                        onChange={(val) => {
                        setHasDependencia(val);
                        if(!val) setFormData({...formData, dependencia: ''}); // Limpa se desmarcar
                        }} 
                        icon={<Lock className="w-5 h-5" />} 
                    />
                    
                    {hasDependencia && (
                        <div className="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-5 animate-in fade-in slide-in-from-top-2">
                        <label className="block text-[11px] font-bold text-amber-800 uppercase tracking-wider mb-2">
                            Qual atividade de qual setor deve ser concluída primeiro?
                        </label>
                        <select 
                            name="dependencia" 
                            value={formData.dependencia} 
                            onChange={handleChange} 
                            required={hasDependencia}
                            className="block w-full rounded-md border-amber-300 bg-white py-2.5 px-3 text-sm text-slate-900 shadow-sm focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500"
                        >
                            <option value="" disabled>Selecione a atividade bloqueadora...</option>
                            {tasks.filter(t => t.status !== STATUS.CONCLUIDA).length === 0 && (
                            <option value="" disabled>Não há atividades pendentes em andamento.</option>
                            )}
                            {tasks.filter(t => t.status !== STATUS.CONCLUIDA).map(t => (
                            <option key={t.id} value={t.id}>
                                [{t.setorExecutor}] - {t.descricao.length > 80 ? t.descricao.substring(0, 80) + '...' : t.descricao}
                            </option>
                            ))}
                        </select>
                        <p className="text-xs text-amber-700 mt-2 font-medium">
                            A sua atividade ficará "bloqueada" até que o gestor dê a baixa final na atividade selecionada acima.
                        </p>
                        </div>
                    )}
                    </div>
                </div>
                </div>

                {/* BLOCO 3: Contexto, Custos e Logística */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50/50 border-b border-slate-200 px-6 py-4 flex items-center">
                    <Target className="w-5 h-5 text-blue-600 mr-2" />
                    <h3 className="text-sm font-bold text-slate-800">Contexto e Recursos</h3>
                </div>
                <div className="p-6 space-y-6">
                    
                    {/* Vínculo com Objetivo Macro */}
                    <div className="bg-blue-50 border border-blue-100 rounded-lg p-5 transition-all">
                    <div className="flex items-center justify-between cursor-pointer" onClick={() => setHasObjetivo(!hasObjetivo)}>
                        <div>
                        <h4 className="text-sm font-bold text-blue-900">Vínculo com Objetivo Macro</h4>
                        <p className="text-xs text-blue-700 mt-1">Esta atividade faz parte de um grande objetivo ou entrega final?</p>
                        </div>
                        <button type="button" className={`relative inline-flex h-6 w-11 flex-shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${hasObjetivo ? 'bg-blue-600' : 'bg-slate-300'}`}>
                        <span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${hasObjetivo ? 'translate-x-5' : 'translate-x-0'}`} />
                        </button>
                    </div>

                    {hasObjetivo && (
                        <div className="mt-4 pt-4 border-t border-blue-200 animate-in fade-in slide-in-from-top-2 duration-300">
                        <label className={labelClass}>Selecione ou Crie o Objetivo</label>
                        <select 
                            className={inputClass}
                            value={isNewObjetivo ? 'NEW' : formData.objetivo}
                            onChange={(e) => {
                            if(e.target.value === 'NEW') {
                                setIsNewObjetivo(true);
                                setFormData({...formData, objetivo: ''});
                            } else {
                                setIsNewObjetivo(false);
                                setFormData({...formData, objetivo: e.target.value});
                            }
                            }}
                        >
                            {objetivos.map(obj => <option key={obj} value={obj}>{obj}</option>)}
                            <option value="NEW" className="font-bold text-blue-600">+ Criar Novo Objetivo...</option>
                        </select>
                        {isNewObjetivo && (
                            <div className="mt-3">
                            <label className={labelClass}>Nome do Novo Objetivo</label>
                            <input type="text" name="objetivo" value={formData.objetivo} onChange={handleChange} placeholder="Ex: Implantação do Sistema ERP" required className={inputClass} />
                            </div>
                        )}
                        </div>
                    )}

                    {/* Outros Vínculos */}
                    <div>
                    <label className={labelClass}>Cliente ou Fornecedor Envolvido</label>
                    <input type="text" name="clienteFornecedor" value={formData.clienteFornecedor} onChange={handleChange} className={inputClass} placeholder="Nome do cliente ou fornecedor (Opcional)" />
                    </div>

                    {/* Toggles Interativos */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div className="space-y-3">
                        <ToggleSwitch 
                        label="Haverá Deslocamento?" 
                        checked={formData.deslocamento} 
                        onChange={(val) => handleToggle('deslocamento', val)} 
                        icon={<Truck className="w-5 h-5" />} 
                        />
                        {formData.deslocamento && (
                        <div className="pl-4 border-l-2 border-blue-500 animate-in fade-in slide-in-from-top-2 space-y-4 mt-3">
                            <div>
                            <label className={labelClass}>Local onde devo comparecer</label>
                            <input type="text" name="local" value={formData.local} onChange={handleChange} className={inputClass} placeholder="Endereço, Cidade ou Empresa" />
                            </div>
                            <div>
                            <label className={labelClass}>Tempo Estimado de Deslocamento</label>
                            <div className="flex gap-2">
                                <input type="number" min="0" name="duracaoDeslocamento" value={formData.duracaoDeslocamento} onChange={handleChange} className={inputClass} placeholder="Ex: 2" />
                                <select name="unidadeDeslocamento" value={formData.unidadeDeslocamento} onChange={handleChange} className={`${inputClass} w-1/3`}>
                                <option value="Horas">Horas</option>
                                <option value="Dias">Dias</option>
                                </select>
                            </div>
                            </div>
                        </div>
                        )}
                    </div>

                    <div className="space-y-3">
                        <ToggleSwitch 
                        label="Esta atividade gera custo?" 
                        checked={formData.geraCusto} 
                        onChange={(val) => handleToggle('geraCusto', val)} 
                        icon={<DollarSign className="w-5 h-5" />} 
                        />
                        {formData.geraCusto && (
                        <div className="pl-4 border-l-2 border-blue-500 animate-in fade-in slide-in-from-top-2 space-y-4 mt-3">
                            <div>
                            <label className={labelClass}>Descrição do Custo</label>
                            <input type="text" name="tipoCusto" value={formData.tipoCusto} onChange={handleChange} className={inputClass} placeholder="Ex: Compra de material, Passagem, etc." />
                            </div>
                            <div>
                            <label className={labelClass}>Valor Estimado (R$)</label>
                            <input type="number" step="0.01" name="valorCusto" value={formData.valorCusto} onChange={handleChange} className={inputClass} placeholder="0.00" />
                            </div>
                        </div>
                        )}
                    </div>
                    </div>

                </div>
                </div>
                
                {/* Barra Flutuante de Ação */}
                <div className="mt-8 flex items-center justify-between bg-slate-800 rounded-xl p-4 shadow-xl border border-slate-700">
                <p className="text-slate-300 text-sm hidden sm:block">Revise as informações antes de salvar.</p>
                <button type="submit" className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg flex items-center justify-center transition-all transform hover:scale-[1.02]">
                    <PlusCircle className="w-5 h-5 mr-2" /> Registrar Atividade no Quadro
                </button>
                </div>
            </form>
            </div>
        );

        // Sub-componente para os Cards de Resumo
        function SummaryCard({ title, value, icon, colorClass }) {
        return (
            <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex items-center space-x-4">
            <div className={`p-3 rounded-full ${colorClass}`}>
                {icon}
            </div>
            <div>
                <p className="text-sm font-medium text-slate-500">{title}</p>
                <p className="text-2xl font-bold text-slate-800">{value}</p>
            </div>
            </div>
        );
        }

        // ABA 2: Gestão à Vista (Quadro Kanban)
        function DashboardView({ tasks, onRequestEvaluation }) {
        // Separa as tarefas por status
        const pendingTasks = tasks.filter(t => t.status === STATUS.PENDENTE);
        const reviewTasks = tasks.filter(t => t.status === STATUS.AGUARDANDO_AVALIACAO);
        const doneTasks = tasks.filter(t => t.status === STATUS.CONCLUIDA);

        // Cálculos para os Cards de Resumo
        const today = new Date().toISOString().split('T')[0];
        const totalAtividades = tasks.length;
        const atrasadas = tasks.filter(t => t.conclusaoPrevista < today && t.status === STATUS.PENDENTE).length;
        const geramCusto = tasks.filter(t => t.geraCusto).length;

        // Cálculos para o Ranking Público de Desempenho (Substitui a coluna de Concluídas)
        const totalDone = doneTasks.length;
        const totalOnTime = doneTasks.filter(t => t.conclusaoReal <= t.conclusaoPrevista).length;
        const globalRate = totalDone > 0 ? Math.round((totalOnTime / totalDone) * 100) : 0;

        const sectorStats = SETORES.map(setor => {
            const completedBySector = doneTasks.filter(t => t.setorExecutor === setor);
            const onTime = completedBySector.filter(t => t.conclusaoReal <= t.conclusaoPrevista).length;
            const total = completedBySector.length;
            const rate = total > 0 ? Math.round((onTime / total) * 100) : 0;
            return { setor, total, onTime, rate };
        }).filter(s => s.total > 0).sort((a, b) => b.rate - a.rate || b.total - a.total); // Ordena pela melhor taxa, e depois por volume

        return (
            <div className="space-y-6">
            {/* KPI Cards / Resumo Rápido */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-2">
                <SummaryCard title="Total de Atividades" value={totalAtividades} icon={<Activity className="w-6 h-6 text-blue-600" />} colorClass="bg-blue-100" />
                <SummaryCard title="Concluídas" value={doneTasks.length} icon={<CheckCircle className="w-6 h-6 text-green-600" />} colorClass="bg-green-100" />
                <SummaryCard title="Atrasadas" value={atrasadas} icon={<AlertCircle className="w-6 h-6 text-red-600" />} colorClass="bg-red-100" />
                <SummaryCard title="Geram Custo" value={geramCusto} icon={<DollarSign className="w-6 h-6 text-orange-600" />} colorClass="bg-orange-100" />
            </div>

            {/* Atividades por Setor */}
            <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-6">
                <h3 className="text-sm font-bold text-slate-700 mb-3 flex items-center"><MapPin className="w-4 h-4 mr-2 text-slate-400" /> Atividades por Setor</h3>
                <div className="flex flex-wrap gap-2">
                {SETORES.map(setor => {
                    const count = tasks.filter(t => t.setorExecutor === setor).length;
                    if (count === 0) return null; // Não mostra o setor se ele não tiver atividades
                    return (
                    <span key={setor} className="bg-slate-100 border border-slate-200 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold flex items-center">
                        {setor} <span className="ml-2 bg-blue-100 text-blue-800 py-0.5 px-2 rounded-full">{count}</span>
                    </span>
                    );
                })}
                {totalAtividades === 0 && <span className="text-xs text-slate-500">Nenhuma atividade registrada no momento.</span>}
                </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Coluna Pendente */}
                <div className="bg-slate-100 rounded-lg p-4 border border-slate-200 shadow-inner">
                <div className="flex items-center justify-between mb-4 pb-2 border-b-2 border-slate-300">
                    <h3 className="font-bold text-slate-700 flex items-center"><Clock className="w-5 h-5 mr-2 text-blue-500"/> Em Andamento</h3>
                    <span className="bg-slate-200 text-slate-600 py-1 px-2 rounded-full text-xs font-bold">{pendingTasks.length}</span>
                </div>
                <div className="space-y-4">
                    {pendingTasks.length === 0 && <p className="text-sm text-slate-400 text-center py-4">Nenhuma tarefa.</p>}
                    {pendingTasks.map(task => {
                    // Inteligência do Kanban: Verificar se a tarefa pai já foi concluída
                    const parentTask = task.dependencia ? tasks.find(t => t.id === task.dependencia) : null;
                    const isBlocked = parentTask && parentTask.status !== STATUS.CONCLUIDA;
                    
                    return (
                        <TaskCard 
                        key={task.id} 
                        task={task} 
                        onAction={() => onRequestEvaluation(task.id)} 
                        actionLabel="Marcar como Feita" 
                        isBlocked={isBlocked}
                        parentTask={parentTask}
                        />
                    )
                    })}
                </div>
                </div>

                {/* Coluna Aguardando Avaliação */}
                <div className="bg-yellow-50 rounded-lg p-4 border border-yellow-100 shadow-inner">
                <div className="flex items-center justify-between mb-4 pb-2 border-b-2 border-yellow-200">
                    <h3 className="font-bold text-yellow-800 flex items-center"><AlertCircle className="w-5 h-5 mr-2 text-yellow-500"/> Aguardando Gestor</h3>
                    <span className="bg-yellow-200 text-yellow-800 py-1 px-2 rounded-full text-xs font-bold">{reviewTasks.length}</span>
                </div>
                <div className="space-y-4">
                    {reviewTasks.length === 0 && <p className="text-sm text-yellow-600 text-center py-4">Nenhuma avaliação pendente.</p>}
                    {reviewTasks.map(task => <TaskCard key={task.id} task={task} isReview />)}
                </div>
                </div>

                {/* NOVA COLUNA: Ranking Público de Desempenho (Substitui Concluídas) */}
                <div className="bg-emerald-50 rounded-lg p-4 border border-emerald-100 shadow-inner flex flex-col">
                <div className="flex items-center justify-between mb-4 pb-2 border-b-2 border-emerald-200">
                    <h3 className="font-bold text-emerald-800 flex items-center"><Trophy className="w-5 h-5 mr-2 text-emerald-600"/> Desempenho das Equipes</h3>
                </div>

                {/* Destaque da Taxa Global */}
                <div className="bg-white rounded-lg p-4 shadow-sm border border-emerald-100 mb-4 text-center">
                    <div className="text-3xl font-extrabold text-emerald-600">{globalRate}%</div>
                    <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mt-1">Taxa Global de Entregas no Prazo</div>
                </div>

                {/* Lista do Ranking por Setor */}
                <div className="space-y-3 overflow-y-auto flex-1 pr-1">
                    {sectorStats.length === 0 && <p className="text-sm text-emerald-600 text-center py-4">Ainda não há tarefas finalizadas para gerar o ranking.</p>}
                    
                    {sectorStats.map((stat, index) => (
                        <div key={stat.setor} className="bg-white p-4 rounded-md shadow-sm border border-slate-100 relative overflow-hidden transition-transform hover:scale-[1.02]">
                        
                        {/* Medalha visual para o 1º Lugar */}
                        {index === 0 && (
                            <div className="absolute top-0 right-0 bg-amber-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-bl-lg flex items-center shadow-sm">
                            1º LUGAR
                            </div>
                        )}

                        <div className="flex justify-between items-end mb-2">
                            <span className="text-sm font-bold text-slate-700">{stat.setor}</span>
                            <span className="text-[10px] text-slate-400 uppercase font-bold"><strong className="text-slate-700 text-xs">{stat.total}</strong> entregas totais</span>
                        </div>

                        {/* Barra de Progresso do Setor */}
                        <div className="w-full bg-slate-100 rounded-full h-2 mb-1.5 overflow-hidden">
                            <div 
                                className={`h-2 rounded-full transition-all duration-1000 ${stat.rate >= 80 ? 'bg-emerald-500' : stat.rate >= 50 ? 'bg-amber-400' : 'bg-red-500'}`} 
                                style={{ width: `${stat.rate}%` }}
                            ></div>
                        </div>
                        <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider">
                            <span className="text-slate-400">Eficiência</span>
                            <span className={stat.rate >= 80 ? 'text-emerald-600' : stat.rate >= 50 ? 'text-amber-600' : 'text-red-600'}>
                            {stat.rate}% no prazo
                            </span>
                        </div>
                        </div>
                    ))}
                </div>
                </div>
            </div>
            </div>
        );
        }

        // Cartão Individual da Tarefa (usado no Dashboard)
        function TaskCard({ task, onAction, actionLabel, isReview, isDone, isBlocked, parentTask }) {
        // Verifica se está atrasada comparando a data atual com a data prevista (ignorando o fuso complexo)
        const today = new Date().toISOString().split('T')[0];
        const isOverdue = task.conclusaoPrevista < today && task.status === STATUS.PENDENTE;

        return (
            <div className={`bg-white p-4 rounded-md shadow-sm border-l-4 transition-all hover:shadow-md relative overflow-hidden ${
            isBlocked ? 'border-l-amber-500 opacity-90' :
            isOverdue ? 'border-l-red-500' : 
            isDone ? 'border-l-green-500' : 
            isReview ? 'border-l-yellow-500' : 'border-l-blue-500'
            }`}>
            <div className="flex justify-between items-start mb-2">
                <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800" title={`Solicitante: ${task.setorSolicitante} | Executor: ${task.setorExecutor}`}>
                {task.setorSolicitante !== task.setorExecutor 
                    ? `${task.setorSolicitante.substring(0,3)} ➔ ${task.setorExecutor}` 
                    : task.setorExecutor}
                </span>
                <span className={`text-xs font-bold px-2 py-0.5 rounded ${
                task.complexidade === 'Alta' ? 'bg-red-100 text-red-800' : 
                task.complexidade === 'Média' ? 'bg-orange-100 text-orange-800' : 'bg-green-100 text-green-800'
                }`}>
                {task.complexidade}
                </span>
            </div>
            
            <p className="text-sm font-semibold text-slate-800 mb-2 line-clamp-2">{task.descricao}</p>
            
            <div className="text-xs text-slate-500 mb-3 space-y-1">
                {/* Só mostra a etiqueta azul de objetivo se a tarefa realmente tiver um */}
                {task.objetivo && (
                <div className="flex items-center font-medium text-blue-700 bg-blue-50 w-fit px-2 py-0.5 rounded"><Activity className="w-3 h-3 mr-1" /> Obj: {task.objetivo}</div>
                )}
                <div className="flex items-center"><Calendar className="w-3 h-3 mr-1" /> Previsto: {new Date(task.conclusaoPrevista).toLocaleDateString('pt-BR')}</div>
                {task.clienteFornecedor && <div className="flex items-center"><UserCog className="w-3 h-3 mr-1" /> {task.clienteFornecedor}</div>}
                
                {/* Novos Detalhes: Deslocamento e Custo */}
                {task.deslocamento && (
                <div className="flex items-center text-indigo-700">
                    <Truck className="w-3 h-3 mr-1" /> 
                    <span>{task.local} {task.duracaoDeslocamento && `(Tempo: ${task.duracaoDeslocamento} ${task.unidadeDeslocamento})`}</span>
                </div>
                )}
                {task.geraCusto && (
                <div className="flex items-center text-orange-700">
                    <DollarSign className="w-3 h-3 mr-1" /> 
                    <span>{task.valorCusto ? `R$ ${task.valorCusto}` : 'Com custo'} - {task.tipoCusto}</span>
                </div>
                )}
            </div>

            {isOverdue && !isBlocked && (
                <div className="mb-3 text-xs font-bold text-red-600 flex items-center bg-red-50 p-1 rounded">
                <AlertCircle className="w-3 h-3 mr-1" /> Atrasada!
                </div>
            )}

            {/* BANNER DE BLOQUEIO INTELIGENTE */}
            {isBlocked && parentTask && (
                <div className="mb-3 text-[11px] font-bold text-amber-800 flex flex-col bg-amber-50 p-2 rounded border border-amber-200">
                <span className="flex items-center mb-1 text-amber-600"><Lock className="w-3 h-3 mr-1" /> Bloqueada até conclusão de:</span>
                <span className="font-medium text-amber-900 line-clamp-1">[{parentTask.setorExecutor}] {parentTask.descricao}</span>
                </div>
            )}

            {onAction && (
                <button 
                onClick={onAction} 
                disabled={isBlocked}
                className={`w-full mt-2 font-medium py-1.5 px-3 rounded text-xs transition-colors ${
                    isBlocked 
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200' 
                    : 'bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200'
                }`}
                >
                {isBlocked ? 'Aguardando Liberação' : actionLabel}
                </button>
            )}
            
            {isReview && <div className="text-xs text-yellow-700 font-medium text-center bg-yellow-100/50 py-1 rounded">Aguardando Avaliação</div>}
            {isDone && <div className="text-xs text-green-700 font-medium text-center bg-green-100/50 py-1 rounded">Aprovada</div>}
            </div>
        );
        }

        // ABA 3: Painel do Gestor
        function ManagerPanelView({ tasks, onCloseTask, onUpdateDeadline }) {
        const [evaluatingTask, setEvaluatingTask] = useState(null); // Controla o modal de avaliação

        // Cálculos de Inteligência para o Gestor
        const today = new Date().toISOString().split('T')[0];
        const pendingTasks = tasks.filter(t => t.status === STATUS.PENDENTE);
        const reviewTasks = tasks.filter(t => t.status === STATUS.AGUARDANDO_AVALIACAO);
        const doneTasks = tasks.filter(t => t.status === STATUS.CONCLUIDA);

        const overdueTasks = pendingTasks.filter(t => t.conclusaoPrevista < today);
        const onTimeDeliveries = doneTasks.filter(t => t.conclusaoReal <= t.conclusaoPrevista);
        const onTimeRate = doneTasks.length > 0 ? Math.round((onTimeDeliveries.length / doneTasks.length) * 100) : 0;

        // Grade Completa por Setor (Analytics)
        const workloadGrid = SETORES.map(setor => {
            const tasksAsExecutor = tasks.filter(t => t.setorExecutor === setor);
            const tasksAsSolicitante = tasks.filter(t => t.setorSolicitante === setor && t.setorExecutor !== setor);
            
            return {
            setor,
            totalRegistradas: tasksAsExecutor.length,
            concluidas: tasksAsExecutor.filter(t => t.status === STATUS.CONCLUIDA).length,
            atrasadas: tasksAsExecutor.filter(t => t.conclusaoPrevista < today && t.status === STATUS.PENDENTE).length,
            apoioAOutros: tasksAsExecutor.filter(t => t.setorSolicitante !== setor).length,
            demandouParaOutros: tasksAsSolicitante.length
            };
        }).filter(w => w.totalRegistradas > 0 || w.demandouParaOutros > 0).sort((a, b) => b.totalRegistradas - a.totalRegistradas);

        // Formulário de Avaliação interno do gestor
        const EvaluationModal = ({ task, onClose }) => {
            const [evalData, setEvalData] = useState({
            avaliacao: '',
            dataAvaliacao: new Date().toISOString().split('T')[0],
            conclusaoReal: task.conclusaoRealUser || new Date().toISOString().split('T')[0],
            necessitaAjuste: false,
            encaminhamento: ''
            });

            const handleSubmit = (e) => {
            e.preventDefault();
            onCloseTask(task.id, evalData);
            onClose(); // Fecha o modal
            };

            const inputClass = "mt-1 block w-full rounded-md border-slate-300 bg-white py-2 px-3 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors border";
            const labelClass = "block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1";

            return (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
                {/* Cabeçalho do Modal */}
                <div className="bg-slate-50 border-b border-slate-100 px-6 py-5 flex justify-between items-center">
                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <CheckCircle className="w-6 h-6 text-blue-600" />
                    Avaliar Atividade
                    </h3>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors text-xl font-bold">
                    ×
                    </button>
                </div>
                
                {/* Corpo do Modal */}
                <div className="p-6 overflow-y-auto max-h-[75vh]">
                    <div className="bg-blue-50/50 border border-blue-100 rounded-lg p-4 mb-6">
                    <span className="text-[10px] font-bold text-blue-500 uppercase tracking-wider">Atividade em Análise</span>
                    <p className="text-sm text-slate-800 font-medium mt-1">{task.descricao}</p>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="space-y-5">
                    <div>
                        <label className={labelClass}>Avaliação do Gestor</label>
                        <textarea required value={evalData.avaliacao} onChange={e => setEvalData({...evalData, avaliacao: e.target.value})} className={inputClass} rows="2" placeholder="Qual o feedback sobre a entrega?"></textarea>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                        <label className={labelClass}>Data da Avaliação</label>
                        <input type="date" required value={evalData.dataAvaliacao} onChange={e => setEvalData({...evalData, dataAvaliacao: e.target.value})} className={inputClass} />
                        </div>
                        <div>
                        <label className={labelClass}>Conclusão Real</label>
                        <input type="date" required value={evalData.conclusaoReal} onChange={e => setEvalData({...evalData, conclusaoReal: e.target.value})} className={`${inputClass} border-green-300 bg-green-50/30`} />
                        </div>
                    </div>

                    <div className="flex items-center p-3 border border-slate-200 rounded-lg bg-slate-50/50 cursor-pointer" onClick={() => setEvalData({...evalData, necessitaAjuste: !evalData.necessitaAjuste})}>
                        <button type="button" className={`relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${evalData.necessitaAjuste ? 'bg-amber-500' : 'bg-slate-300'}`}>
                        <span className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${evalData.necessitaAjuste ? 'translate-x-4' : 'translate-x-0'}`} />
                        </button>
                        <span className="ml-3 text-sm font-semibold text-slate-700">Necessita de Ajuste Posterior?</span>
                    </div>

                    <div>
                        <label className={labelClass}>Encaminhamento / Decisão Final</label>
                        <textarea required value={evalData.encaminhamento} onChange={e => setEvalData({...evalData, encaminhamento: e.target.value})} className={inputClass} rows="2" placeholder="Quais os próximos passos?"></textarea>
                    </div>

                    <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onClick={onClose} className="px-5 py-2.5 text-sm text-slate-600 font-bold bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Cancelar</button>
                        <button type="submit" className="px-5 py-2.5 text-sm text-white font-bold bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md flex items-center transition-colors">
                        <CheckCircle className="w-4 h-4 mr-2"/> Confirmar e Dar Baixa
                        </button>
                    </div>
                    </form>
                </div>
                </div>
            </div>
            );
        };

        return (
            <div className="space-y-6">
            {/* SEÇÃO 1: INDICADORES DO GESTOR */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {/* Card: Ação Necessária */}
                <div className="bg-white rounded-xl shadow-sm border border-blue-200 p-5 flex items-start space-x-4">
                <div className="p-3 bg-blue-100 rounded-lg"><UserCog className="w-6 h-6 text-blue-700" /></div>
                <div>
                    <h3 className="text-slate-500 text-sm font-semibold">Aguardando sua Avaliação</h3>
                    <div className="flex items-baseline space-x-2">
                    <span className="text-3xl font-bold text-slate-800">{reviewTasks.length}</span>
                    <span className="text-sm text-slate-500">atividades</span>
                    </div>
                    {reviewTasks.length > 0 && <p className="text-xs text-blue-600 mt-1 font-medium">Requer atenção imediata!</p>}
                </div>
                </div>

                {/* Card: Saúde das Entregas */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-start space-x-4">
                <div className="p-3 bg-green-100 rounded-lg"><TrendingUp className="w-6 h-6 text-green-700" /></div>
                <div>
                    <h3 className="text-slate-500 text-sm font-semibold">Taxa de Entrega no Prazo</h3>
                    <div className="flex items-baseline space-x-2">
                    <span className="text-3xl font-bold text-slate-800">{doneTasks.length > 0 ? `${onTimeRate}%` : '--'}</span>
                    </div>
                    <p className="text-xs text-slate-500 mt-1">Das {doneTasks.length} tarefas já concluídas</p>
                </div>
                </div>

                {/* Card: Risco Global */}
                <div className="bg-white rounded-xl shadow-sm border border-red-200 p-5 flex items-start space-x-4">
                <div className="p-3 bg-red-100 rounded-lg"><AlertTriangle className="w-6 h-6 text-red-700" /></div>
                <div>
                    <h3 className="text-slate-500 text-sm font-semibold">Risco Operacional (Atrasos)</h3>
                    <div className="flex items-baseline space-x-2">
                    <span className="text-3xl font-bold text-red-600">{overdueTasks.length}</span>
                    <span className="text-sm text-slate-500">atrasadas</span>
                    </div>
                    <p className="text-xs text-red-600 mt-1 font-medium">De {pendingTasks.length} em andamento</p>
                </div>
                </div>
            </div>

            <div className="grid grid-cols-1 gap-6">
                {/* SEÇÃO 2: GRADE COMPLETA POR SETOR (Analytics de Carga) */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><BarChart3 className="w-5 h-5 mr-2 text-blue-600"/> Desempenho e Carga por Setor</h3>
                <div className="overflow-x-auto border rounded-lg">
                    <table className="min-w-full divide-y divide-slate-200">
                    <thead className="bg-slate-50">
                        <tr>
                        <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Setor Executor</th>
                        <th className="px-4 py-3 text-center text-xs font-medium text-slate-500 uppercase tracking-wider">Total Atribuídas</th>
                        <th className="px-4 py-3 text-center text-xs font-medium text-slate-500 uppercase tracking-wider">Concluídas</th>
                        <th className="px-4 py-3 text-center text-xs font-medium text-slate-500 uppercase tracking-wider">Atrasadas</th>
                        <th className="px-4 py-3 text-center text-xs font-medium text-slate-500 uppercase tracking-wider" title="Tarefas feitas para outros setores">Apoio a Outros (Cruzado)</th>
                        </tr>
                    </thead>
                    <tbody className="bg-white divide-y divide-slate-200">
                        {workloadGrid.length === 0 && (
                        <tr><td colSpan="5" className="px-4 py-4 text-center text-slate-500 text-sm">Nenhum dado de setor.</td></tr>
                        )}
                        {workloadGrid.map(w => (
                        <tr key={w.setor} className="hover:bg-slate-50">
                            <td className="px-4 py-3 whitespace-nowrap font-medium text-slate-800 text-sm">{w.setor}</td>
                            <td className="px-4 py-3 whitespace-nowrap text-center text-sm font-bold text-blue-600">{w.totalRegistradas}</td>
                            <td className="px-4 py-3 whitespace-nowrap text-center text-sm font-bold text-green-600">{w.concluidas}</td>
                            <td className="px-4 py-3 whitespace-nowrap text-center text-sm font-bold text-red-600">{w.atrasadas}</td>
                            <td className="px-4 py-3 whitespace-nowrap text-center text-sm">
                            {w.apoioAOutros > 0 ? (
                                <span className="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-bold">{w.apoioAOutros} tarefas</span>
                            ) : '-'}
                            </td>
                        </tr>
                        ))}
                    </tbody>
                    </table>
                </div>
                </div>

                {/* SEÇÃO 3: TABELA DE GERENCIAMENTO (Ações do Gestor) */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div className="mb-4 p-6 border-b border-slate-100 bg-slate-50/50">
                    <h2 className="text-xl font-bold text-slate-800">Lista de Gerenciamento Operacional</h2>
                    <p className="text-sm text-slate-500 mt-1">Avalie entregas e ajuste prazos críticos de forma rápida.</p>
                </div>

                <div className="overflow-x-auto overflow-y-auto flex-1">
                    <table className="min-w-full divide-y divide-slate-200">
                    <thead className="bg-slate-50">
                        <tr>
                        <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Atividade & Detalhes</th>
                        <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Status</th>
                        <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Prazo</th>
                        <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Ações do Gestor</th>
                        </tr>
                    </thead>
                    <tbody className="bg-white divide-y divide-slate-100">
                        {tasks.length === 0 && (
                        <tr><td colSpan="4" className="px-6 py-8 text-center text-slate-500">Nenhuma tarefa no sistema.</td></tr>
                        )}
                        
                        {tasks.map(task => {
                        const today = new Date().toISOString().split('T')[0];
                        const isOverdue = task.conclusaoPrevista < today && task.status === STATUS.PENDENTE;

                        // Define as cores dos Status
                        const statusClasses = {
                            [STATUS.CONCLUIDA]: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                            [STATUS.AGUARDANDO_AVALIACAO]: 'bg-amber-50 text-amber-700 border-amber-200',
                            [STATUS.PENDENTE]: 'bg-slate-50 text-slate-600 border-slate-200'
                        };

                        return (
                            <tr key={task.id} className="hover:bg-slate-50/80 transition-colors group">
                            <td className="px-6 py-5">
                                <div className="flex flex-col gap-1.5">
                                <span className="text-sm font-bold text-slate-800 line-clamp-2 pr-4">{task.descricao}</span>
                                <div className="flex flex-wrap items-center gap-2 text-xs font-medium">
                                    <span className="flex items-center text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                                    <MapPin className="w-3 h-3 mr-1" /> Resp: {task.setorExecutor}
                                    </span>
                                    {task.setorSolicitante !== task.setorExecutor && (
                                    <span className="flex items-center text-slate-500 border border-slate-200 px-2 py-0.5 rounded">
                                        Solic: {task.setorSolicitante}
                                    </span>
                                    )}
                                    {task.objetivo && (
                                    <span className="flex items-center text-blue-700 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded">
                                        <Target className="w-3 h-3 mr-1" /> Obj: {task.objetivo}
                                    </span>
                                    )}
                                    {task.deslocamento && (
                                    <span className="flex items-center text-indigo-700 bg-indigo-50 border border-indigo-100 px-2 py-0.5 rounded" title={`Local: ${task.local}`}>
                                        <Truck className="w-3 h-3 mr-1" /> {task.duracaoDeslocamento ? `${task.duracaoDeslocamento} ${task.unidadeDeslocamento}` : 'Deslocamento'}
                                    </span>
                                    )}
                                    {task.geraCusto && (
                                    <span className="flex items-center text-orange-700 bg-orange-50 border border-orange-100 px-2 py-0.5 rounded" title={task.tipoCusto}>
                                        <DollarSign className="w-3 h-3 mr-1" /> {task.valorCusto ? `R$ ${task.valorCusto}` : 'Custo Registrado'}
                                    </span>
                                    )}
                                </div>
                                </div>
                            </td>
                            
                            <td className="px-6 py-5 whitespace-nowrap">
                                <span className={`px-3 py-1 inline-flex text-[11px] uppercase tracking-wider font-bold rounded-full border ${statusClasses[task.status]}`}>
                                {task.status}
                                </span>
                            </td>
                            
                            <td className="px-6 py-5 whitespace-nowrap">
                                <div className="flex flex-col gap-1.5">
                                <span className="text-sm font-semibold text-slate-700">
                                    {new Date(task.conclusaoPrevista).toLocaleDateString('pt-BR')}
                                </span>
                                {isOverdue && (
                                    <span className="inline-flex items-center gap-1 text-[10px] uppercase font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded w-fit border border-rose-100">
                                    <AlertCircle className="w-3 h-3"/> Atrasado
                                    </span>
                                )}
                                </div>
                            </td>
                            
                            <td className="px-6 py-5 whitespace-nowrap text-right">
                                
                                {/* AÇÃO: Aguardando Avaliação */}
                                {task.status === STATUS.AGUARDANDO_AVALIACAO && (
                                <button 
                                    onClick={() => setEvaluatingTask(task)} 
                                    className="inline-flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg shadow-sm transition-all font-bold text-sm transform active:scale-95"
                                >
                                    <CheckCircle className="w-4 h-4"/> Avaliar Entrega
                                </button>
                                )}

                                {/* AÇÃO: Pendente e Atrasado (Input Refinado) */}
                                {task.status === STATUS.PENDENTE && isOverdue && (
                                <div className="flex flex-col items-end gap-1 relative">
                                    <span className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Ajustar Prazo</span>
                                    <div className="relative group/input">
                                    <input 
                                        type="date" 
                                        className="pl-3 pr-2 py-1.5 bg-white border border-rose-200 text-rose-700 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-rose-500 focus:border-rose-500 shadow-sm transition-all cursor-pointer hover:border-rose-400" 
                                        onChange={(e) => {
                                        if(confirm('Confirmar novo prazo e remover atraso?')) {
                                            onUpdateDeadline(task.id, e.target.value);
                                        }
                                        }} 
                                    />
                                    </div>
                                </div>
                                )}
                                
                                {/* AÇÃO: Fechado/Concluída */}
                                {task.status === STATUS.CONCLUIDA && (
                                <span className="inline-flex items-center gap-1 text-emerald-600 text-sm font-bold bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100">
                                    <CheckCircle className="w-4 h-4"/> Baixa Realizada
                                </span>
                                )}
                            </td>
                            </tr>
                        )
                        })}
                    </tbody>
                    </table>
                </div>
                </div>
            </div>

            {/* Renderiza o modal se o gestor clicar em "Avaliar" */}
            {evaluatingTask && (
                <EvaluationModal task={evaluatingTask} onClose={() => setEvaluatingTask(null)} />
            )}
            </div>
        );
        }

        // --- RENDERIZAÇÃO NO DOM ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
